<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart Voting System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="nav">
    <a class="brand" href="{{ url_for('index') }}">Smart Voting System</a>
    <nav>
      <a href="{{ url_for('index') }}">Home</a>
      <a href="{{ url_for('register') }}">New User</a>
      <a href="{{ url_for('verify') }}">Party Voting</a>
      <a href="{{ url_for('admin') }}">Admin</a>
      <a class="btn-login" href="{{ url_for('admin_login') }}">Secure Login</a>
    </nav>
  </header>

  <main class="container {% block container_class %}{% endblock %}">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/camera.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
