{% extends "base.html" %}
{% block title %}Secure Login{% endblock %}
{% block content %}
<section class="phone">
  <div class="phone-head">Admin Secure Login</div>
  <div class="phone-body">
    <form method="post">
      <label class="field"><span>Username</span><input name="username" required autofocus></label>
      <label class="field"><span>Password</span><input name="password" type="password" required></label>
      <button class="btn primary block" type="submit">Login</button>
    </form>
  </div>
</section>
{% endblock %}
